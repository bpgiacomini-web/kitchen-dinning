<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Password recovery · Metro Eats</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:24px 16px; background:#0d1015; color:#f6f1e9; font:16px/1.5 system-ui,sans-serif; }
    main { max-width:440px; margin:8vh auto; padding:28px; background:#171a20; border:1px solid #3b414b; border-radius:18px; }
    h1 { margin:0 0 8px; font-size:28px; } p { color:#c1c6cf; }
    label { display:block; margin-top:16px; }
    input { width:100%; margin-top:6px; padding:13px; border:1px solid #555d69; border-radius:8px; background:#0d1015; color:white; font:inherit; }
    button { width:100%; min-height:46px; margin-top:20px; padding:13px; border:0; border-radius:8px; background:#e8b66a; color:#171a20; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; } a { color:#e8b66a; }
    :focus-visible { outline:3px solid #e8b66a; outline-offset:3px; }
    [hidden] { display:none !important; } #recovery-status { min-height:24px; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <main>
    <h1 id="recovery-title">Forgot password?</h1>
    <p id="recovery-description">Enter your account email to request a password reset link.</p>
    <form id="recovery-request">
      <label for="recovery-email">Email</label>
      <input id="recovery-email" type="email" autocomplete="email" maxlength="254" required>
      <button type="submit">Send reset link</button>
    </form>
    <form id="recovery-reset" hidden>
      <label for="recovery-password">New password</label>
      <input id="recovery-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <label for="recovery-confirm">Confirm new password</label>
      <input id="recovery-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <button type="submit">Save new password</button>
    </form>
    <p id="recovery-status" role="status" aria-live="polite"></p>
    <p><a href="./reset-password.html" id="recovery-another" hidden>Request a new reset link</a></p>
    <p><a href="./">Back to sign in</a></p>
    <noscript>Enable JavaScript to recover your account.</noscript>
  </main>
  <script type="module" src="./src/features/password-recovery.mjs?v=1"></script>
</body>
</html>
