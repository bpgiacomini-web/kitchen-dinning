<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metro Eats Data Import</title><style>body{background:#090b0d;color:#f4f1e8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px}.card{background:#12171a;border:1px solid #394248;border-radius:18px;padding:20px;margin:14px 0}h1{font-size:30px}textarea{width:100%;box-sizing:border-box;min-height:260px;background:#080a0c;color:#dfe5e8;border:1px solid #394248;border-radius:10px;padding:10px;font:12px ui-monospace,SFMono-Regular,monospace}button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:12px;background:#f4f1e8;color:#111;font-weight:700;font-size:16px}.small{color:#b9c1c5}.good{color:#9fe3ad;font-weight:700}</style></head><body><div class="card"><h1>Metro Eats Data Import</h1><p>Paste the backup copied from the old Safari Metro Eats site below.</p><p class="small">Nothing is saved until you press the import button.</p><textarea id="data" placeholder="Paste the copied Metro Eats backup here"></textarea><button id="check">CHECK BACKUP</button><button id="import" style="display:none">IMPORT & MERGE INTO THIS METRO EATS</button><div id="result"></div></div><script>var ta=document.getElementById('data'),res=document.getElementById('result');document.getElementById('check').onclick=function(){try{var p=JSON.parse(ta.value),src=p.sources||{};var a=[];Object.keys(src).forEach(function(k){var d=src[k]||{};a.push(k+': '+(d.recipes||[]).length+' recipes, '+(d.restaurants||[]).length+' restaurants')});res.innerHTML='<p class="good">Backup is valid.</p><p>'+a.join('<br>')+'</p><p class="small">This check does not change Metro Eats data.</p>'}catch(e){res.innerHTML='<p>That does not look like a valid Metro Eats backup. Please paste the complete copied text.</p>'}};</script></body></html>
