name: Update Metro Eats local news

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: metro-eats-news-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Metro Eats
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update news.json
        run: python scripts/update_news.py
      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "Update Metro Eats local news"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
