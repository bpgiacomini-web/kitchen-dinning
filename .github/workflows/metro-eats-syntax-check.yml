name: Metro Eats JavaScript Syntax Check

on:
  push:
    branches:
      - fix/recipe-import-extraction-2026-10-23
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app JavaScript syntax
        run: node --check app.js
