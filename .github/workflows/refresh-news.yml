name: Refresh Metro Eats News

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh local dining news
        run: python scripts/update_news.py

      - name: Commit updated news
        run: |
          git config user.name "metro-eats-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Refresh local dining news"
          git push
