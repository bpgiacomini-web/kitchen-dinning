<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Kitchen">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>My Kitchen & Dining</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--text:#20201e;--muted:#77736d;--line:#e5e0d8;--accent:#d9c8a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
main{max-width:720px;margin:auto;padding:24px 18px 50px}.hero{padding:18px 2px 20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}h1{font-size:34px;letter-spacing:-.04em;margin:5px 0}h2{margin:0 0 4px}.muted{color:var(--muted);font-size:14px}
nav{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:16px;margin-bottom:20px}button{font:inherit;min-height:44px;border:0;cursor:pointer}nav button{background:transparent;border-radius:12px;font-weight:700;color:var(--muted)}nav button.active{background:var(--accent);color:var(--text)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:14px}.big{font-size:24px;font-weight:800}.primary{background:var(--accent);padding:10px 15px;border-radius:13px;font-weight:800}.secondary{background:transparent;border:1px solid var(--line);padding:10px 15px;border-radius:13px;font-weight:700}.search,input,textarea,select{width:100%;font:inherit;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin:12px 0}.card{padding:16px;margin:12px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;color:var(--muted);margin-top:8px}.icon{width:44px;height:44px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-size:21px;flex:none}.content{min-width:0;flex:1}.stars{letter-spacing:1px}.empty{text-align:center;border:1px dashed var(--line);padding:30px 15px;border-radius:18px;color:var(--muted)}details{margin-top:14px}summary{font-weight:700;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap}.delete{background:none;color:var(--muted);padding:5px}.hidden{display:none!important}pre{white-space:pre-wrap;font:inherit;color:var(--muted)}@media(max-width:430px){main{padding:18px 14px 40px}h1{font-size:30px}}
</style>
</head>
<body>
<main>
<header class="hero">
<div class="eyebrow">YOUR PERSONAL FOOD JOURNAL</div>
<h1>My Kitchen & Dining</h1>
<div class="muted">Recipes worth keeping. Restaurants worth remembering.</div>
<div class="stats"><div class="stat"><div id="rc" class="big">1</div><div class="muted">Recipes saved</div></div><div class="stat"><div id="dc" class="big">0</div><div class="muted">Restaurants</div></div></div>
</header>
<nav><button id="nt" class="active">🍳 Recipes</button><button id="nd">🍽️ Restaurants</button></nav>

<section id="recipes">
<div class="row"><div><h2>Recipe Collection</h2><div class="muted">Your favorites in one place.</div></div><button id="addR" class="primary">＋ Recipe</button></div>
<input id="rs" class="search" placeholder="⌕  Search recipes, ingredients…">
<div id="rl"></div>
<div id="rf" class="card hidden"><h3>Add a recipe</h3><form id="rform"><input id="rn" required placeholder="Recipe name"><input id="rg" placeholder="Category / occasion"><textarea id="ri" placeholder="Ingredients — one per line"></textarea><textarea id="rd" placeholder="Directions"></textarea><div class="actions"><button class="primary">Save recipe</button><button type="button" id="rcancel" class="secondary">Cancel</button></div></form></div>
</section>

<section id="dining" class="hidden">
<div class="row"><div><h2>Restaurant Journal</h2><div class="muted">Remember what you loved—and what to skip.</div></div><button id="addD" class="primary">＋ Restaurant</button></div>
<input id="ds" class="search" placeholder="⌕  Search restaurants, dishes, cities…">
<div id="dl"></div>
<div id="df" class="card hidden"><h3>Add a restaurant</h3><form id="dform"><input id="dn" required placeholder="Restaurant name"><input id="dlc" placeholder="📍 City, neighborhood, or address"><input id="do" placeholder="What did you order?"><select id="dr"><option value="5">★★★★★ Excellent</option><option value="4">★★★★☆ Very good</option><option value="3">★★★☆☆ Good</option><option value="2">★★☆☆☆ Disappointing</option><option value="1">★☆☆☆☆ Avoid</option></select><select id="dret"><option>Absolutely would return</option><option>Probably would return</option><option>Maybe</option><option>Would not return</option></select><textarea id="dnote" placeholder="Your personal notes"></textarea><div class="actions"><button class="primary">Save restaurant</button><button type="button" id="dcancel" class="secondary">Cancel</button></div></form></div>
</section>
</main>
<script>
const key="mkd-v1";
let data=JSON.parse(localStorage.getItem(key)||"null")||{
recipes:[{id:1,name:"Ultimate Thanksgiving Broccoli Cheese Rice Casserole",cat:"Thanksgiving",ing:"4 cups cooked long-grain white rice\\n1½ lbs broccoli florets\\n12 oz Velveeta, cubed\\n1 cup sharp cheddar, shredded\\n1 can (10.5 oz) cream of chicken soup\\n½ cup milk\\n½ medium onion\\n4 tbsp butter\\n½ tsp garlic powder\\n½ tsp black pepper\\n¼ tsp cayenne\\n1 cup crispy fried onions",dir:"Steam broccoli until just tender. Sauté onion in butter. Add soup and milk, then melt in Velveeta over low heat. Stir in seasonings. Fold sauce with rice and broccoli. Transfer to a buttered 9×13 dish, top with cheddar, and bake at 350°F for 25–30 minutes. Add crispy onions during the last 5–7 minutes."}],
restaurants:[]
};
const $=id=>document.getElementById(id), save=()=>localStorage.setItem(key,JSON.stringify(data));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderR(){let q=$("rs").value.toLowerCase(),a=data.recipes.filter(x=>(x.name+" "+x.cat+" "+x.ing).toLowerCase().includes(q));$("rl").innerHTML=a.length?a.map(x=>`<article class="card"><div class="row"><div class="row"><div class="icon">🥘</div><div class="content"><b>${esc(x.name)}</b><div class="tag">${esc(x.cat||"Recipe")}</div></div></div><button class="delete" data-r="${x.id}">Delete</button></div><details><summary>View recipe</summary><p><b>Ingredients</b></p><pre>${esc(x.ing)}</pre><p><b>Directions</b></p><p class="muted">${esc(x.dir)}</p></details></article>`).join(""):`<div class="empty">No recipes found.<br>Try another search or add a recipe.</div>`}
function renderD(){let q=$("ds").value.toLowerCase(),a=data.restaurants.filter(x=>(x.name+" "+x.loc+" "+x.order+" "+x.notes).toLowerCase().includes(q));$("dl").innerHTML=a.length?a.map(x=>`<article class="card"><div class="row"><div class="row"><div class="icon">🍽️</div><div class="content"><b>${esc(x.name)}</b><div class="muted">📍 ${esc(x.loc||"Location not entered")}</div></div></div><button class="delete" data-d="${x.id}">Delete</button></div><div style="margin-top:12px"><span class="stars">${"★".repeat(+x.rating)}${"☆".repeat(5-+x.rating)}</span> <span class="muted">${esc(x.ret)}</span></div>${x.order?`<p><b>Ordered:</b> ${esc(x.order)}</p>`:""}${x.notes?`<p class="muted">${esc(x.notes)}</p>`:""}</article>`).join(""):`<div class="empty">No restaurants saved yet.<br>Start building your personal dining guide.</div>`}
function counts(){$("rc").textContent=data.recipes.length;$("dc").textContent=data.restaurants.length}
$("nt").onclick=()=>{ $("recipes").classList.remove("hidden");$("dining").classList.add("hidden");$("nt").classList.add("active");$("nd").classList.remove("active")};
$("nd").onclick=()=>{ $("dining").classList.remove("hidden");$("recipes").classList.add("hidden");$("nd").classList.add("active");$("nt").classList.remove("active")};
$("addR").onclick=()=>{$("rf").classList.remove("hidden");$("rn").focus()};$("rcancel").onclick=()=>$("rf").classList.add("hidden");
$("rform").onsubmit=e=>{e.preventDefault();data.recipes.push({id:Date.now(),name:$("rn").value,cat:$("rg").value,ing:$("ri").value,dir:$("rd").value});save();e.target.reset();$("rf").classList.add("hidden");renderR();counts()};
$("rs").oninput=renderR;$("rl").onclick=e=>{if(e.target.dataset.r){data.recipes=data.recipes.filter(x=>x.id!=e.target.dataset.r);save();renderR();counts()}};
$("addD").onclick=()=>{$("df").classList.remove("hidden");$("dn").focus()};$("dcancel").onclick=()=>$("df").classList.add("hidden");
$("dform").onsubmit=e=>{e.preventDefault();data.restaurants.push({id:Date.now(),name:$("dn").value,loc:$("dlc").value,order:$("do").value,rating:$("dr").value,ret:$("dret").value,notes:$("dnote").value});save();e.target.reset();$("df").classList.add("hidden");renderD();counts()};
$("ds").oninput=renderD;$("dl").onclick=e=>{if(e.target.dataset.d){data.restaurants=data.restaurants.filter(x=>x.id!=e.target.dataset.d);save();renderD();counts()}};
renderR();renderD();counts();
</script>
</body>
</html>
